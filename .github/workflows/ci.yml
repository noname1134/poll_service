name: Python CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Check lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: python -m pytest tests/ -v

    mysql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Start test MySQL
        run: docker compose -p poll-integration -f compose.test.yaml up -d --wait --wait-timeout 180

      - name: Run MySQL integration tests
        env:
          RUN_MYSQL_TESTS: "1"
        run: python -m pytest tests/integration/ -v

      - name: Show database logs on failure
        if: failure()
        run: docker compose -p poll-integration -f compose.test.yaml logs

      - name: Stop test MySQL
        if: always()
        run: docker compose -p poll-integration -f compose.test.yaml down
